name: Verify TicketMonster
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.0.0
      - run: npm ci
      - run: npm run check
      - run: forge fmt --check src test
